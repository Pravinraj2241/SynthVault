spring.application.name=synthvault-mca

# ---- MySQL connection (plain JDBC - SQL + MySQL skills) ----
spring.datasource.url=jdbc:mysql://localhost:3306/synthvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---- File storage folders (core Java - java.nio) ----
app.upload.dir=uploads
app.synthetic.dir=synthetic

# ---- Upload limits (basic Spring Boot multipart setting) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
